name: mufuse_strip
description: "The MuFuse desk strip: a thin always-on-top window for `mufuse serve` (feature 005)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

# No runtime packages: the strip talks to the engine with dart:io alone.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
